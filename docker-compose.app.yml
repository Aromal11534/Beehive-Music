# Compose interpolation intentionally comes from .env.server. Start this file
# with: docker compose --env-file .env.server -f docker-compose.app.yml up -d
services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    container_name: beehive-yt-cipher
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      - API_TOKEN=${YT_CIPHER_API_TOKEN}
      - OVERRIDE_PLAYER_VARIANT=IAS

  lavalink:
    build:
      context: ./infra/lavalink
      dockerfile: Dockerfile
    image: beehive-lavalink:4.2.2-youtube-1.18.2
    container_name: beehive-lavalink
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - SERVER_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./infra/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --header=\"Authorization: $${LAVALINK_SERVER_PASSWORD}\" -qO- http://127.0.0.1:$${SERVER_PORT}/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - yt-cipher

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: beehive-migrate
    restart: "no"
    networks:
      - baota_net
    env_file:
      - ${BEEHIVE_ENV_FILE:-.env.server}
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: beehive-api
    restart: unless-stopped
    networks:
      - baota_net
    env_file:
      - ${BEEHIVE_ENV_FILE:-.env.server}
    environment:
      - FASTAPI_ENV=${FASTAPI_ENV:-production}
      - DEBUG=false
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8001}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:${API_PORT:-8001}"
    volumes:
      - ./storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: beehive-bot
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-}
      - LAVALINK_HOST=${LAVALINK_HOST:-lavalink}
      - LAVALINK_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - API_BASE_URL=${API_BASE_URL:-http://api:8001}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      lavalink:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Beehive}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
        NEXT_PUBLIC_DISCORD_REDIRECT_URI: ${NEXT_PUBLIC_DISCORD_REDIRECT_URI:-https://beehive.teamsyndicate.org/auth/discord/callback}
    container_name: beehive-web
    restart: unless-stopped
    networks:
      - baota_net
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-/api/v1}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Beehive}
      - NEXT_PUBLIC_DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - NEXT_PUBLIC_DISCORD_REDIRECT_URI=${NEXT_PUBLIC_DISCORD_REDIRECT_URI:-https://beehive.teamsyndicate.org/auth/discord/callback}
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: beehive-admin
    networks:
      - baota_net
    profiles:
      - tools
    env_file:
      - ${BEEHIVE_ENV_FILE:-.env.server}
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    stdin_open: true
    tty: true
    command: sh -lc "pip install --no-cache-dir -r scripts/requirements.txt && python scripts/interactive_admin.py"

networks:
  baota_net:
    external: true
