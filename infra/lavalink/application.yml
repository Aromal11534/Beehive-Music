server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      # Do not let user-supplied web URLs turn Lavalink into an internal HTTP client.
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 1000
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 3
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_MUSIC
      - MWEB
      - WEB
      - IOS
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEBEMBEDDED
    oauth:
      enabled: true
      skipInitialization: true
      # refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: "${YT_CIPHER_API_TOKEN:}"
      userAgent: "Beehive-Music"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
